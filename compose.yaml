services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_NAME: practice
      DB_USER: student_app
      DB_PASSWORD: practice_password
      DB_HOST: db
      SECRET_KEY: dev-secret-key
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: student_app
      POSTGRES_PASSWORD: practice_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
