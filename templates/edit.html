<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>
    <h1>Edit Student</h1>

    <form action="/update/{{ student[0] }}" method="POST">
        <label for="name">Name:</label>
        <input
            id="name"
            type="text"
            name="name"
            value="{{ student[1] }}"
            required
        >

        <label for="school">School:</label>
        <input
            id="school"
            type="text"
            name="school"
            value="{{ student[2] }}"
            required
        >

        <button type="submit">Save Changes</button>
    </form>

    <a href="/">Cancel</a>
</body>
</html>
